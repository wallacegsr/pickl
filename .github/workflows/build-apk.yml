name: Build Android APK

on:
  # No `paths` filter on the push event, deliberately. A path filter applies to
  # branch and tag pushes alike, so filtering to android/** would skip a release
  # tag whose commit happens not to touch that directory -- exactly the build
  # that matters most. An Android build is a couple of minutes; a release tag
  # that silently produces no APK is worse.
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Job-level env is readable from a step's `if`, where step-level env is
      # not. This turns "was a keystore configured?" into a plain boolean the
      # signing steps can gate on.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        # Provisions Gradle itself, so the binary wrapper jar does not have to
        # be committed to the repository.
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug "-PbuildSha=${GITHUB_SHA::7}"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pickl-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # --- Release builds only run for a tag, and only when a keystore exists.
      # Without these secrets the job still succeeds and simply produces the
      # debug APK above, so forks are not broken by missing signing material.
      - name: Decode keystore
        id: keystore
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pickl.jks"
          echo "path=$RUNNER_TEMP/pickl.jks" >> "$GITHUB_OUTPUT"

      # Fails in seconds with a clear message when a secret is wrong, rather
      # than several minutes into R8 with a signing error that does not say
      # which of the four secrets is at fault. Output is discarded because the
      # listing is noise, not because it is sensitive.
      - name: Verify the keystore opens
        if: steps.keystore.outputs.path != ''
        env:
          KS: ${{ steps.keystore.outputs.path }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_TYPE: ${{ vars.ANDROID_KEYSTORE_TYPE }}
        run: |
          TYPE_ARG=""
          [ -n "$KS_TYPE" ] && TYPE_ARG="-storetype $KS_TYPE"
          if ! keytool -list -keystore "$KS" -storepass "$KS_PASS" -alias "$KS_ALIAS" $TYPE_ARG > /dev/null 2>&1; then
            echo "::error::Could not open the keystore with the supplied secrets."
            echo "Check ANDROID_KEYSTORE_BASE64 (must be raw base64, no PEM header lines),"
            echo "ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS."
            echo "For a PKCS#12 keystore (a .p12/.pfx exported from PowerShell): set the"
            echo "repository variable ANDROID_KEYSTORE_TYPE to PKCS12, make sure the alias"
            echo "matches the certificate's FriendlyName, and note that PKCS#12 requires"
            echo "ANDROID_KEY_PASSWORD to be identical to ANDROID_KEYSTORE_PASSWORD."
            exit 1
          fi
          echo "Keystore opened and alias found."

      - name: Build signed release APK
        if: steps.keystore.outputs.path != ''
        working-directory: android
        env:
          PICKL_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          PICKL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PICKL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PICKL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PICKL_KEYSTORE_TYPE: ${{ vars.ANDROID_KEYSTORE_TYPE }}
        run: gradle --no-daemon assembleRelease "-PbuildSha=${GITHUB_SHA::7}"

      - name: Attach release APK to the GitHub release
        if: steps.keystore.outputs.path != ''
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
